test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: CloudfrontS3
  bucket: <%= ENV["S3_BUCKET_NAME"] %>
  cloudfront_host: <%= ENV["CLOUDFRONT_HOST"] %>
  cloudfront_key_pair_id: <%= ENV["CLOUDFRONT_KEY_PAIR_ID"] %>
  cloudfront_private_key: <%= ENV["CLOUDFRONT_PRIVATE_KEY"].to_json %>
  # The following settings are all set with environment variables
  # access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
  # secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
  # region: us-east-1
  upload:
    # Don't allow intermediataries to cache, and browser can cache
    # for 1 hour.
    cache_control: 'private, max-age=3600'
